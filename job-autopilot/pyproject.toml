[project]
name = "jobpilot"
version = "0.1.0"
description = "Personal job-application autopilot: discover, tailor, one-click apply, track."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 2+ (installed as each phase lands)
discover = ["python-jobspy>=1.1"]
tailor = ["anthropic>=0.40", "jinja2>=3.1", "weasyprint>=62"]
apply = ["playwright>=1.45"]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
